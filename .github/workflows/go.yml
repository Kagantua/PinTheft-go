name: Build for Linux amd64

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # 或者更高版本，兼容项目中的代码

    - name: Build for Linux amd64
      run: |
        GOOS=linux GOARCH=amd64 go build -o pintheft-go-linux-amd64 .
      # 这会在项目根目录生成二进制文件

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pintheft-go-linux-amd64
        path: pintheft-go-linux-amd64
